<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrushiVikash | Organic Marketplace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #27ae60;
            --soft-green: #ebf5ee;
            --dark-text: #2c3e50;
        }

        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; color: var(--dark-text); }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        /* Modern Hero Section */
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('/images/home-bg.jpg');
            background-size: cover; background-position: center;
            height: 80vh; display: flex; align-items: center; color: white;
            border-radius: 0 0 50px 50px;
        }

        .hero-content span { color: #f1c40f; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
        .hero-content h3 { font-size: 4rem; margin: 1rem 0; line-height: 1.2; }

        /* Card Styling */
        .modern-card {
            border: none; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: all 0.3s ease; background: white;
            overflow: hidden; height: 100%;
        }
        .modern-card:hover { transform: translateY(-10px); box-shadow: 0 15px 40px rgba(39, 174, 96, 0.15); }

        .category-img { height: 120px; object-fit: contain; margin-top: 20px; }
        .product-img { height: 200px; object-fit: cover; width: 100%; }

        /* Buttons */
        .btn-organic { background: var(--primary-green); color: white; border-radius: 30px; padding: 10px 25px; font-weight: 600; border: none; transition: 0.3s; }
        .btn-organic:hover { background: #219150; color: white; transform: scale(1.05); }
        .btn-wishlist { background: #f39c12; color: white; border-radius: 30px; border: none; padding: 10px 20px; margin-bottom: 10px; }

        .price-badge { background: #e74c3c; color: white; padding: 5px 15px; border-radius: 0 20px 20px 0; position: absolute; top: 15px; left: 0; z-index: 10; }
        .view-eye { position: absolute; top: 15px; right: 15px; background: white; color: var(--primary-green); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="hero-section">
    <div class="container">
        <div class="hero-content col-md-6">
            <span>Don't panic, go organic</span>
            <h3>Reach For A Healthier You With Organic Foods</h3>
            <p class="mb-4">Experience the purity of nature delivered directly from local farmers to your doorstep.</p>
            <a th:href="@{/about}" class="btn btn-organic btn-lg">Explore More</a>
        </div>
    </div>
</div>

<section class="container py-5">
    <h2 class="text-center mb-5">Shop By <span class="text-success">Category</span></h2>
    <div class="row g-4 justify-content-center">
        <div class="col-6 col-md-3">
            <div class="modern-card text-center p-3">
                <img th:src="@{/images/cat-1.png}" class="category-img" alt="fruits">
                <h4 class="mt-3">Fruits</h4>
                <a th:href="@{/category(category='fruits')}" class="btn btn-sm btn-outline-success rounded-pill px-4 mt-2">Browse</a>
            </div>
        </div>
    </div>
</section>

<section class="bg-light py-5">
    <div class="container">
        <h2 class="text-center mb-5">Latest <span class="text-success">Produce</span></h2>
        <div class="row g-4">
            <div class="col-12 col-sm-6 col-lg-3" th:each="product : ${productList}">
                <form th:action="@{/cart/add}" method="POST" class="modern-card position-relative">
                    <div class="price-badge">$<span th:text="${product.price}">15</span>/-</div>
                    <a th:href="@{/view(id=${product.id})}" class="view-eye"><i class="fas fa-eye"></i></a>

                    <img th:src="@{'/images/' + ${product.image}}" class="product-img" alt="product">

                    <div class="p-4">
                        <h4 class="mb-2" th:text="${product.name}">Organic Carrots</h4>
                        <div class="d-flex align-items-center mb-3">
                            <label class="me-2 small fw-bold">Qty:</label>
                            <input type="number" min="1" value="1" name="p_qty" class="form-control form-control-sm w-50">
                        </div>

                        <input type="hidden" name="pid" th:value="${product.id}">
                        <button type="submit" name="add_to_wishlist" class="btn btn-wishlist w-100">
                            <i class="far fa-heart me-2"></i>Wishlist
                        </button>
                        <button type="submit" name="add_to_cart" class="btn btn-organic w-100">
                            <i class="fas fa-shopping-cart me-2"></i>Add to Cart
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
