<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Identity | KrushiVikash</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: #f4f7f6;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .verify-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .verify-card {
            background: #ffffff;
            max-width: 450px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: #ebf5ee;
            color: #27ae60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
        }

        .verify-card h3 {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .otp-input {
            letter-spacing: 10px;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 25px;
            color: #27ae60;
        }

        .otp-input:focus {
            border-color: #27ae60;
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.1);
        }

        .btn-verify {
            background: #27ae60;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            transition: 0.3s;
        }

        .btn-verify:hover {
            background: #219150;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .error-alert {
            background: #fff5f5;
            color: #c53030;
            border-left: 4px solid #fc8181;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="verify-wrapper">
    <div class="verify-card">
        <div class="icon-box">
            <i class="fas fa-shield-alt"></i>
        </div>

        <h3>Verify OTP</h3>
        <p class="text-muted small mb-4">
            We have sent a 6-digit verification code to <br>
            <span class="text-success fw-bold" th:text="${email}">user@example.com</span>
        </p>

        <div th:if="${param.error}" class="error-alert">
            <i class="fas fa-exclamation-circle me-2"></i> The OTP you entered is incorrect. Please try again.
        </div>

        <form th:action="@{/verify-otp}" method="post">
            <input type="hidden" name="email" th:value="${email}">
            <input type="hidden" name="type" th:value="${type}">

            <div class="mb-3">
                <input type="text" name="otp" class="form-control otp-input"
                       required placeholder="000000" maxlength="6" pattern="\d{6}">
            </div>

            <button type="submit" class="btn btn-verify text-white shadow-sm">
                Verify & Continue
            </button>
        </form>

        <p class="mt-4 small text-muted">
            Didn't receive the code? <a href="#" class="text-success text-decoration-none fw-bold">Resend Email</a>
        </p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
