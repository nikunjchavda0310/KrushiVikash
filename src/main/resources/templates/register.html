<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | KrushiVikash</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
    }

    .register-container {
      max-width: 600px;
      margin: 50px auto;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      padding: 40px;
    }

    .form-title {
      font-weight: 700;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Keep your backend error styling but make it look modern */
    .field-error {
      color: #dc3545;
      font-size: 0.85rem;
      margin-top: 4px;
      font-weight: 500;
      display: block;
    }

    .form-control, .form-select {
      border-radius: 10px;
      padding: 12px 15px;
      border: 1px solid #dee2e6;
      transition: 0.3s;
    }

    .form-control:focus {
      box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.2);
      border-color: #27ae60;
    }

    /* Custom File Upload */
    .upload-area {
      border: 2px dashed #27ae60;
      background: #f8fff9;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .upload-area:hover {
      background: #efffef;
    }

    #image-preview {
      max-width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      display: none;
      margin: 15px auto 0;
      border: 3px solid #27ae60;
    }

    .btn-register {
      background: #27ae60;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: 0.3s;
      width: 100%;
      color: white;
    }

    .btn-register:hover {
      background: #219150;
      transform: translateY(-2px);
    }

    .global-error {
      background-color: #fff5f5;
      color: #c53030;
      padding: 12px;
      border-radius: 10px;
      border-left: 5px solid #fc8181;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
  <div class="register-container">
    <h3 class="form-title">Join KrushiVikash</h3>

    <form id="regForm" th:action="@{/register}" enctype="multipart/form-data" method="POST" onsubmit="return validateForm(event)" novalidate>

      <div th:if="${error}" class="global-error">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${error}"></span>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">I am a...</label>
          <select name="user_type" id="user_type" class="form-select">
            <option value="" disabled selected>Select Role</option>
            <option value="farmer">Farmer</option>
            <option value="client">Client</option>
          </select>
          <span id="user_type_err" class="field-error"></span>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Gender</label>
          <select name="gender" id="gender" class="form-select">
            <option value="" disabled selected>Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
          <span id="gender_err" class="field-error"></span>
        </div>

        <div class="col-12">
          <input type="text" name="name" id="name" class="form-control" placeholder="Full Name">
          <span id="name_err" class="field-error"></span>
        </div>

        <div class="col-12">
          <input type="email" name="email" id="email" class="form-control" placeholder="Email Address">
          <span id="email_err" class="field-error"></span>
        </div>

        <div class="col-md-6">
          <input type="password" name="pass" id="pass" class="form-control" placeholder="Password">
          <span id="pass_err" class="field-error"></span>
        </div>
        <div class="col-md-6">
          <input type="password" name="cpass" id="cpass" class="form-control" placeholder="Confirm Password">
          <span id="cpass_err" class="field-error"></span>
        </div>

        <div class="col-12">
          <input type="tel" name="contact" id="contact" class="form-control" placeholder="Phone Number (10 digits)">
          <span id="contact_err" class="field-error"></span>
        </div>

        <div class="col-12" id="address-container">
          <textarea name="address" id="address" class="form-control" placeholder="Full Home Address" rows="3"></textarea>
          <span id="address_err" class="field-error"></span>
        </div>

        <div class="col-12">
          <span id="image_err" class="field-error"></span>
          <div class="upload-area" onclick="document.getElementById('image-input').click()">
            <i class="fas fa-camera fa-2x text-success mb-2"></i>
            <p id="upload-label" class="mb-0">Click to upload profile photo</p>
            <img id="image-preview" src="" alt="Preview">
            <input type="file" name="image" id="image-input" accept="image/*" style="display: none;">
          </div>
        </div>

        <div class="col-12 mt-4">
          <button type="submit" class="btn btn-register shadow">Register Now</button>
          <p class="text-center mt-3 mb-0">Already have an account? <a th:href="@{/login}" class="text-success fw-bold text-decoration-none">Login here</a></p>
        </div>
      </div>
    </form>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
  /* ALL YOUR EXISTING JS LOGIC REMAINS EXACTLY THE SAME */
  document.getElementById('name').addEventListener('input', function() {
      this.value = this.value.replace(/[^a-zA-Z\s]/g, '');
  });

  const fileInput = document.getElementById('image-input');
  fileInput.addEventListener('change', function() {
      const preview = document.getElementById('image-preview');
      const label = document.getElementById('upload-label');
      const file = this.files[0];
      if (file) {
          label.innerText = "Selected: " + file.name;
          const reader = new FileReader();
          reader.onload = (e) => {
              preview.src = e.target.result;
              preview.style.display = 'block';
          };
          reader.readAsDataURL(file);
      }
  });

  const userTypeSelect = document.getElementById('user_type');
  const addressContainer = document.getElementById('address-container');
  const addressInput = document.getElementById('address');
  const addressError = document.getElementById('address_err');

  function toggleAddress() {
      if (userTypeSelect.value === 'farmer') {
          addressContainer.style.display = 'none';
          addressError.innerText = "";
          addressInput.value = "";
      } else {
          addressContainer.style.display = 'block';
      }
  }

  userTypeSelect.addEventListener('change', toggleAddress);
  window.addEventListener('DOMContentLoaded', toggleAddress);

  function validateForm(event) {
      let isValid = true;
      const form = document.getElementById('regForm');
      document.querySelectorAll('.field-error').forEach(el => el.innerText = "");

      const showError = (id, msg) => {
          const errorSpan = document.getElementById(id + '_err');
          if(errorSpan) errorSpan.innerText = "⚠ " + msg;
          isValid = false;
      };

      const selectedRole = form.user_type.value;
      if (!selectedRole) showError('user_type', "Role is required");
      if (form.name.value.trim().length < 3) showError('name', "Name is too short");
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(form.email.value)) showError('email', "Invalid email");
      if (form.pass.value.length < 6) showError('pass', "Min 6 characters");
      else if (form.pass.value !== form.cpass.value) showError('cpass', "Passwords mismatch");
      if (!/^[0-9]{10}$/.test(form.contact.value)) showError('contact', "10-digit number required");
      if (!form.gender.value) showError('gender', "Gender required");
      if (selectedRole !== 'farmer' && form.address.value.trim().length < 10) showError('address', "Address required for Clients");
      if (!fileInput.files[0]) {
          document.getElementById('image_err').innerText = "⚠ Photo is required";
          isValid = false;
      }

      if (!isValid) {
          event.preventDefault();
          window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      return isValid;
  }
</script>
</body>
</html>
