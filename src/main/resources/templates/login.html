<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | KrushiVikash</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
    }

    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      overflow: hidden;
      max-width: 900px;
      width: 100%;
      display: flex;
    }

    /* Left Side Branding */
    .login-info {
      background: linear-gradient(rgba(39, 174, 96, 0.9), rgba(33, 145, 80, 0.9)),
                  url('https://images.unsplash.com/photo-1500651230702-0e2d8a49d4ad?auto=format&fit=crop&q=80&w=600');
      background-size: cover;
      background-position: center;
      color: white;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 40%;
    }

    /* Right Side Form */
    .login-form-area {
      padding: 50px;
      width: 60%;
    }

    .form-title {
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .form-control, .form-select {
      border-radius: 10px;
      padding: 12px 15px;
      margin-bottom: 5px;
      border: 1px solid #dee2e6;
    }

    .form-control:focus {
      border-color: #27ae60;
      box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.1);
    }

    .btn-login {
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      width: 100%;
      margin-top: 15px;
      transition: 0.3s;
    }

    .btn-login:hover {
      background: #219150;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
    }

    .field-error {
      color: #dc3545;
      font-size: 0.85rem;
      margin-bottom: 10px;
      display: block;
      font-weight: 500;
    }

    .input-error { border: 1px solid #dc3545 !important; }

    .alert-modern {
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    @media (max-width: 768px) {
      .login-info { display: none; }
      .login-form-area { width: 100%; padding: 30px; }
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="login-wrapper">
  <div class="login-card">

    <div class="login-info">
      <h2 class="fw-bold">Welcome Back!</h2>
      <p class="mt-3">Log in to manage your fresh produce or shop the best organic items in Gujarat.</p>
    </div>

    <div class="login-form-area">
      <h3 class="form-title">Login Now</h3>

      <div th:if="${param.error}" class="alert alert-danger alert-modern d-flex align-items-center">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:with="errorObj=${session['SPRING_SECURITY_LAST_EXCEPTION']}">
            <span th:text="${errorObj != null ? errorObj.message : 'Invalid Credentials or User Type'}">Error</span>
        </span>
      </div>

      <div th:if="${param.success}" class="alert alert-success alert-modern">
        <i class="fas fa-check-circle me-2"></i> Account verified! Please login.
      </div>

      <form id="loginForm" th:action="@{/login}" method="POST" onsubmit="return validateLoginForm(event)" novalidate>

        <div class="mb-3">
          <label class="form-label fw-bold small">Email Address</label>
          <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com">
          <span id="email_err" class="field-error"></span>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold small">Password</label>
          <input type="password" name="pass" id="pass" class="form-control" placeholder="••••••••">
          <span id="pass_err" class="field-error"></span>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold small">Login As</label>
          <select name="user_type" id="user_type" class="form-select">
            <option value="" disabled selected>Select User Type</option>
            <option value="farmer">Farmer</option>
            <option value="client">Client</option>
            <option value="admin">Admin</option>
          </select>
          <span id="user_type_err" class="field-error"></span>
        </div>

        <button type="submit" class="btn btn-login shadow-sm">Login Now</button>

        <p class="text-center mt-4 small text-muted">
          Don't have an account? <a th:href="@{/register}" class="text-success fw-bold text-decoration-none">Register Now</a>
        </p>
      </form>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:if="${param.logout}">
  Swal.fire({
      title: 'Logged Out!',
      text: 'You have been successfully logged out.',
      icon: 'success',
      confirmButtonColor: '#27ae60'
  });
  if (window.history.replaceState) {
      const url = window.location.protocol + "//" + window.location.host + window.location.pathname;
      window.history.replaceState({path: url}, '', url);
  }
</script>

<script>
  function validateLoginForm(event) {
      let isValid = true;
      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('pass');
      const typeInput = document.getElementById('user_type');

      document.querySelectorAll('.field-error').forEach(el => el.innerText = "");
      document.querySelectorAll('.form-control, .form-select').forEach(el => el.classList.remove('input-error'));

      const showError = (id, msg) => {
          const errorSpan = document.getElementById(id + '_err');
          if(errorSpan) { errorSpan.innerText = "⚠ " + msg; }
          document.getElementById(id).classList.add('input-error');
          isValid = false;
      };

      if (!emailInput.value.trim()) showError('email', "Email is required");
      if (!passInput.value) showError('pass', "Password is required");
      if (!typeInput.value) showError('user_type', "User type is required");

      if (!isValid) {
          event.preventDefault();
          return false;
      }
      return true;
  }
</script>

</body>
</html>
