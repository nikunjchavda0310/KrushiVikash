<header th:fragment="client_header" class="header-section"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">



    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-2">
        <div class="container">
            <a th:href="@{/client/index}" class="navbar-brand fw-bold fs-3">
                Krushi<span class="text-success">Vikash</span><span class="text-warning">.</span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#clientNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="clientNav">
                <ul class="navbar-nav mx-auto" id="navLinks">
                    <li class="nav-item"><a class="nav-link px-3 fw-medium" th:href="@{/client/index}">Home</a></li>
                    <li class="nav-item"><a class="nav-link px-3 fw-medium" th:href="@{/client/shop}">Shop</a></li>
                    <li class="nav-item"><a class="nav-link px-3 fw-medium" th:href="@{/client/orders}">Orders</a></li>
                    <li class="nav-item"><a class="nav-link px-3 fw-medium" th:href="@{/client/about}">About</a></li>
                    <li class="nav-item"><a class="nav-link px-3 fw-medium" th:href="@{/client/contact}">Contact</a></li>
                </ul>

                <div class="header-icons">
                    <a th:href="@{/client/search}" class="nav-icon-link">
                        <i class="fas fa-search"></i>
                    </a>

                    <div class="dropdown">
                        <!-- Main Bell Icon -->
                        <a href="#" class="nav-icon-link position-relative" id="notifDropdown"
                           data-bs-toggle="dropdown" onclick="markAsSeen()">
                            <i class="fas fa-bell"></i>
                            <span th:if="${notifCount > 0}" id="notifBadge"
                                  class="badge rounded-pill bg-danger position-absolute"
                                  th:text="${notifCount}">0</span>
                        </a>

                        <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-3 profile-dropdown" style="width: 320px;">
                            <div class="p-3 border-bottom bg-light d-flex justify-content-between align-items-center">
                                <h6 class="mb-0 fw-bold small text-uppercase">Notifications</h6>
                                <!-- Fixed: Changed clearNotificationBadge() to markAsSeen() -->
                                <small class="text-success" style="cursor:pointer; font-size: 0.7rem;" onclick="markAsSeen()">Mark all as read</small>
                            </div>

                            <div class="notif-scroll" style="max-height: 350px; overflow-y: auto;">
                                <!-- Outer loop for messages -->
                                <div th:each="msg : ${clientSentMessages}">
                                    <!-- Inner loop for replies (Now relies on Java-side sorting to avoid SpEL errors) -->
                                    <div th:each="reply : ${msg.replies}"
                                         class="p-3 border-bottom dropdown-item"
                                         style="white-space: normal; background-color: #f9fffb;">
                                        <div class="d-flex">
                                            <div class="notif-icon-circle bg-success-subtle text-success me-3">
                                                <i class="fas fa-reply small"></i>
                                            </div>
                                            <div>
                                                <p class="mb-0 small fw-bold text-dark">Admin Replied:</p>
                                                <p class="mb-1 small text-muted text-wrap" th:text="${reply.message}" style="line-height: 1.4;"></p>
                                                <div class="d-flex align-items-center">
                                                    <i class="far fa-clock me-1 text-secondary" style="font-size: 0.65rem;"></i>
                                                    <small class="text-secondary" style="font-size: 0.7rem;"
                                                           th:text="${#temporals.format(reply.sentAt, 'dd MMM, hh:mm a')}"></small>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Empty State -->
                                <div th:if="${#lists.isEmpty(clientSentMessages) || (notifCount == 0 && #lists.isEmpty(clientSentMessages))}"
                                     class="p-5 text-center text-muted">
                                    <i class="fas fa-bell-slash d-block mb-3 fs-3 opacity-25"></i>
                                    <p class="small mb-0">All caught up!</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <a th:href="@{/client/wishlist}" class="nav-icon-link position-relative">
                        <i class="fas fa-heart"></i>
                        <span th:if="${wishlistCount > 0}" th:text="${wishlistCount}"
                              class="badge rounded-pill bg-danger position-absolute">0</span>
                    </a>

                    <a th:href="@{/client/cart}" class="nav-icon-link position-relative">
                        <i class="fas fa-shopping-cart"></i>
                        <span th:if="${cartCount > 0}" th:text="${cartCount}"
                              class="badge rounded-pill bg-success position-absolute">0</span>
                    </a>

                    <div class="dropdown ms-2">
                        <div class="profile-trigger" id="userDropdown" data-bs-toggle="dropdown" style="cursor:pointer;">
                            <img th:src="${currentUser != null && currentUser.image != null && currentUser.image != ''} ? @{'/uploads/' + ${currentUser.image}} : @{/images/pic-1.png}"
                                 class="rounded-circle profile-img-nav">
                        </div>
                        <div class="dropdown-menu dropdown-menu-end profile-dropdown border-0 shadow-lg mt-3">
                            <div class="text-center p-4 border-bottom">
                                <img th:src="${currentUser != null && currentUser.image != null && currentUser.image != ''} ? @{'/uploads/' + ${currentUser.image}} : @{/images/pic-1.png}"
                                     class="rounded-circle mb-3 shadow-sm" style="width: 70px; height: 70px; object-fit: cover;">
                                <h6 class="mb-1 fw-bold text-dark" th:text="${currentUser != null ? currentUser.name : 'User'}">User</h6>
                                <p class="text-muted small mb-0"><span sec:authentication="principal.username">email</span></p>
                            </div>
                            <div class="p-2">
                                <a th:href="@{/client/user_profile_update}" class="dropdown-item rounded-3 mb-1">
                                    <i class="fas fa-user-edit me-2 text-success"></i> Profile
                                </a>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item rounded-3 text-danger border-0 bg-transparent w-100 text-start">
                                        <i class="fas fa-sign-out-alt me-2"></i> Logout
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <style>
        .header-section { font-family: 'Poppins', sans-serif; }

        /* 1. ICON ALIGNMENT FIX */
        .header-icons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-icon-link {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444 !important;
            text-decoration: none;
            position: relative;
        }

        .nav-icon-link i { font-size: 1.25rem !important; }

        /* 2. BADGE POSITIONING */
        .header-icons .badge {
            top: 2px !important;
            right: -2px !important;
            font-size: 0.65rem;
            padding: 2px 5px;
            border: 2px solid white;
        }

        /* 3. ACTIVE UNDERLINE FIX */
        .nav-link {
            color: #444 !important;
            font-size: 0.95rem;
            position: relative;
            transition: 0.3s;
            padding-bottom: 5px;
        }

        .nav-link.active-link {
            color: #27ae60 !important;
            font-weight: 700 !important;
        }

        .nav-link.active-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 15%;
            width: 70%;
            height: 3px;
            background-color: #27ae60;
            border-radius: 10px;
        }

        /* Profile Image */
        .profile-img-nav {
            width: 38px;
            height: 38px;
            object-fit: cover;
            border: 2px solid #eee;
            border-radius: 50%;
        }

        .profile-dropdown {
            width: 280px;
            border-radius: 15px;
            overflow: hidden;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1) !important;
        }

        .dropdown-item { padding: 10px 20px; display: flex; align-items: center; }
        .dropdown-item:hover { background-color: #f0fff4; color: #27ae60; }

        .modern-alert { position: fixed; top: 20px; right: 20px; z-index: 2000; border-left: 5px solid #27ae60; }
    </style>

    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Handle Active Links
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                const linkHref = link.getAttribute('href');
                if (currentPath === linkHref || (currentPath === "/client/" && linkHref.includes("index"))) {
                    link.classList.add('active-link');
                } else {
                    link.classList.remove('active-link');
                }
            });

            // 2. THE ONLY ALERT LISTENER (Global)
            const message = /*[[${message}]]*/ null;
            const error = /*[[${error}]]*/ null;
            const info = /*[[${info}]]*/ null;

            if (message || error || info) {
                const Toast = Swal.mixin({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true
                });

                if (error) {
                    Toast.fire({ icon: 'error', title: error });
                } else if (message) {
                    Toast.fire({ icon: 'success', title: message });
                } else if (info) {
                    Toast.fire({ icon: 'info', title: info });
                }
            }
        });

        function markAsSeen() {
            const badge = document.getElementById('notifBadge');
            if (badge) badge.style.display = 'none';
            const csrfToken = document.querySelector('input[name="_csrf"]')?.value;
            fetch('/client/reset-notif-count', {
                method: 'POST',
                headers: { 'X-CSRF-TOKEN': csrfToken }
            }).catch(err => console.error(err));
        }
        /*]]>*/
    </script>
</header>
