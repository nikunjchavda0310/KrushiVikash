<header th:fragment="header" class="header-section" xmlns:th="http://www.w3.org/1999/xhtml">

    <div class="message-container container" th:if="${message}">
        <div class="alert alert-success alert-dismissible fade show modern-alert" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${message}">Success message here!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a th:href="@{/home}" class="navbar-brand fw-bold fs-2">
                Krushi<span class="text-success">Vikash</span><span class="text-warning">.</span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link px-3 fw-medium" th:href="@{/index}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 fw-medium" th:href="@{/about}">About</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-outline-success rounded-pill px-4 me-2" th:href="@{/login}">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-success rounded-pill px-4 text-white" th:href="@{/register}">Join Now</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <style>
        /* Modern Header Custom Styles */
        .header-section {
            width: 100%;
            z-index: 1000;
        }

        .navbar {
            padding: 1rem 0;
            transition: all 0.3s ease;
        }

        .navbar-brand {
            letter-spacing: -1px;
            color: #2c3e50 !important;
        }

        .nav-link {
            color: #555 !important;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #27ae60 !important;
        }

        /* Modern Alert Styling */
        .modern-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1100;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: white;
            border-left: 5px solid #27ae60;
            padding: 1.5rem 3rem 1.5rem 1.5rem;
            font-size: 1.1rem;
        }

        /* Fix for mobile navbar overlapping content */
        @media (max-width: 991px) {
            .navbar-collapse {
                background: white;
                padding: 1rem;
                border-radius: 15px;
                margin-top: 10px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            }
        }
    </style>
</header>
