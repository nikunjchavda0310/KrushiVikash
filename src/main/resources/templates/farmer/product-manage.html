<div th:fragment="product-list" xmlns:th="http://www.w3.org/1999/xhtml">
  <div class="row fadeIn animated">
    <div class="col-12">
      <div th:if="${success}" class="alert alert-success border-0 shadow-sm mb-3">
        <i class="fas fa-check-circle me-2"></i> <span th:text="${success}"></span>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
          <h5 class="mb-0 text-dark fw-bold">
            <i class="fas fa-leaf me-2 text-success"></i>
            <span th:text="${selectedCategory.name}">Category</span> Management
          </h5>
          <button class="btn btn-success btn-sm fw-bold shadow-sm"
                  data-bs-toggle="modal"
                  data-bs-target="#addProductModal"
                  onclick="resetProductForm()">
            <i class="fas fa-plus me-1"></i> Add <span th:text="${selectedCategory.name}">Item</span>
          </button>
        </div>

        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
              <tr>
                <th class="ps-4">Product Details</th>
                <th>Price</th>
                <th>Stock Status</th>
                <th>Visibility Status</th>
                <th class="text-center">Actions</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="p : ${products}">
                <td class="ps-4">
                  <div class="d-flex align-items-start">
                    <div class="d-flex flex-wrap gap-1 me-3" style="width: 80px;">
                      <th:block th:if="${p.image != null}">
                        <div th:each="imgName : ${#strings.arraySplit(p.image, ',')}"
                             class="bg-light rounded border d-flex align-items-center justify-content-center"
                             style="width: 35px; height: 35px; overflow: hidden;">
                          <img th:src="@{/uploads/{name}(name=${imgName})}"
                               class="img-fluid"
                               style="object-fit: cover; width: 100%; height: 100%;"
                               alt="product">
                        </div>
                      </th:block>
                      <div th:unless="${p.image != null}"
                           class="bg-light rounded p-1 border d-flex align-items-center justify-content-center"
                           style="width: 50px; height: 50px;">
                        <i class="fas fa-carrot text-success fa-lg"></i>
                      </div>
                    </div>

                    <div>
                      <div class="fw-bold text-dark" th:text="${p.productName}">Name</div>
                      <small class="text-muted" th:text="${#strings.abbreviate(p.description, 40)}"></small>
                    </div>
                  </div>
                </td>
                <td class="fw-bold text-dark" th:text="'₹' + ${p.price}">₹0</td>
                <td>
                  <div th:text="${p.stock} + ' ' + ${p.units}">10 kg</div>
                  <div th:if="${p.stock <= 5}" class="badge bg-soft-danger text-danger border-0 small" style="background-color: #fee2e2;">Low Stock</div>
                </td>

                <td>
                  <div class="d-flex align-items-center">
                    <div th:id="'status-label-' + ${p.id}"
                         th:class="${p.active} ? 'text-success me-2' : 'text-danger me-2'">
                      <i th:class="${p.active} ? 'fas fa-circle' : 'fas fa-circle-notch'"></i>
                      <small class="fw-bold" th:text="${p.active} ? 'Live' : 'Hidden'"></small>
                    </div>

                    <button class="btn btn-sm btn-outline-secondary border-0"
                            title="Quick Toggle Visibility"
                            th:onclick="'toggleVisibility(' + ${p.id} + ')'">
                      <i th:id="'eye-icon-' + ${p.id}"
                         th:class="${p.active} ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
                    </button>
                  </div>
                </td>

                <td class="text-center">
                  <button class="btn btn-sm btn-light text-primary me-2 fw-bold"
                          title="Edit"
                          th:onclick="openEditModal([[${p.id}]], [[${p.productName}]], [[${p.price}]], [[${p.stock}]], [[${p.units}]], [[${p.description}]], [[${p.active}]], [[${p.image}]])">
                    Edit
                  </button>

                  <button class="btn btn-sm btn-light text-danger fw-bold"
                          title="Delete"
                          th:onclick="|handleProductDelete(${p.id})|">
                    Delete
                  </button>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="5" class="text-center py-5 text-muted">
                  <i class="fas fa-box-open fa-3x mb-3 d-block opacity-25"></i>
                  No items found in this category.
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addProductModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-dark text-white">
          <h6 class="modal-title fs-5" id="modalTitle">
            <i class="fas fa-plus-circle me-2 text-success"></i>New Item
          </h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <form id="productForm" enctype="multipart/form-data">
          <input type="hidden" id="productId" name="id">
          <input type="hidden" name="categoryId" th:value="${selectedCategory.id}">

          <div class="modal-body p-4">
            <div class="mb-4">
              <label class="form-label fw-bold small text-uppercase text-muted">Product Name</label>
              <input type="text" id="pName" class="form-control form-control-lg bg-light border-0" placeholder="e.g. Fresh Apples" required>
            </div>

            <div class="row">
              <div class="col-md-4 mb-4">
                <label class="form-label fw-bold small text-uppercase text-muted">Price (₹)</label>
                <input type="number" id="pPrice" step="0.01" class="form-control bg-light border-0" required>
              </div>
              <div class="col-md-4 mb-4">
                <label class="form-label fw-bold small text-uppercase text-muted">Stock Quantity</label>
                <input type="number" id="pStock" class="form-control bg-light border-0" required>
              </div>
              <div class="col-md-4 mb-4">
                <label class="form-label fw-bold small text-uppercase text-muted">Unit Type</label>
                <select id="pUnits" class="form-select bg-light border-0">
                  <option value="kg">Kilogram (kg)</option>
                  <option value="piece">Piece (pc)</option>
                  <option value="quintal">Quintal</option>
                  <option value="gram">Gram (g)</option>
                </select>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold small text-uppercase text-muted">Description</label>
              <textarea id="pDesc" class="form-control bg-light border-0" rows="3"
                        th:text="${product.description}" required></textarea>

              <div th:if="${descError}" class="text-danger small mt-1 animate__animated animate__shakeX">
                <i class="fas fa-exclamation-circle me-1"></i>
                <span th:text="${descError}"></span>
              </div>
            </div>

            <div class="row">
              <div class="col-md-7 mb-3">
                <div id="imagePreviewSection" class="mb-4 d-none">
                  <label class="form-label fw-bold small text-uppercase text-muted">Current Photos</label>
                  <div id="currentImagePreview" class="p-2 bg-light rounded border d-flex flex-wrap gap-2">
                  </div>
                </div>

                <label class="form-label fw-bold small text-uppercase text-muted">Product Photos (Min 3)</label>
                <input type="file" id="productImagesInput" name="productImages" class="form-control bg-light border-0" accept="image/*" multiple>

                <div id="fileCountError" class="text-danger small mt-1" style="display:none;">
                  <i class="fas fa-info-circle me-1"></i> Please select at least 3 images.
                </div>
                <small id="editPhotoNotice" class="text-info d-none mt-2">
                  <i class="fas fa-info-circle me-1"></i> Note: Uploading new photos will replace current ones.
                </small>
              </div>

              <div class="col-md-5 mb-3">
                <div class="card border-0 bg-light shadow-none">
                  <div class="card-body py-2 px-3">
                    <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0">
                      <label class="form-check-label fw-bold small text-uppercase mb-0" for="pActive">
                        Status: <span id="statusText" class="text-success">Active</span>
                      </label>
                      <input class="form-check-input ms-0" type="checkbox" id="pActive" checked
                             style="width: 2.5em; height: 1.25em; cursor: pointer;">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="modal-footer border-0 bg-light p-3">
            <button type="button" class="btn btn-secondary px-4 fw-bold" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="submitBtn" onclick="handleProductSubmit()" class="btn btn-success px-5 fw-bold shadow-sm">
              Save Product
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
