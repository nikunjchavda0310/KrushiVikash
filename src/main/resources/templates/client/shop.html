<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | KrushiVikash</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body { background-color: #f8f9fa; font-family: 'Poppins', sans-serif; }

    .shop-header {
      background: #fff;
      padding: 30px 0;
      border-bottom: 1px solid #eee;
      margin-bottom: 40px;
    }

    .category-filter {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 25px;
      border-radius: 50px;
      background: #fff;
      border: 2px solid #27ae60;
      color: #27ae60;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: #27ae60;
      color: #fff;
      box-shadow: 0 5px 15px rgba(39, 174, 96, 0.2);
    }

    .product-card {
      background: #fff;
      border: none;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      transition: 0.3s ease;
      height: 100%;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 35px rgba(39, 174, 96, 0.15);
    }

    .price-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #27ae60;
      color: white;
      padding: 5px 15px;
      border-radius: 30px;
      font-weight: 700;
      z-index: 10;
    }

    .view-link {
      position: absolute;
      top: 15px;
      right: 15px;
      background: white;
      color: #27ae60;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 10;
      transition: 0.3s;
    }

    .view-link:hover { background: #27ae60; color: #fff; }

    .image-holder {
      height: 220px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdfdfd;
    }

    .product-img { max-height: 100%; max-width: 100%; object-fit: contain; transition: 0.5s; }
    .product-card:hover .product-img { transform: scale(1.1); }

    .qty-input {
      max-width: 90px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      border: 1px solid #eee;
    }

    .btn-cart {
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      width: 100%;
      transition: 0.3s;
    }

    .btn-wishlist {
      background: #fdf2f2;
      color: #e74c3c;
      border: 1px solid #fee2e2;
      border-radius: 12px;
      padding: 8px;
      width: 100%;
      margin-bottom: 10px;
      font-size: 0.9rem;
      transition: 0.3s;
    }

    .btn-wishlist:hover { background: #e74c3c; color: white; }

      /* Modern active state for Wishlist button */
.btn-wishlist.is-active {
    background: #fff5f5 !important;
    color: #e74c3c !important;
    border-color: #fab1a0 !important;
    font-weight: 600;
}

.btn-wishlist.is-active i {
    color: #e74c3c !important;
    transform: scale(1.1);
    transition: transform 0.2s ease;
}

.btn-wishlist:active {
    transform: scale(0.95);
}

  </style>
</head>
<body>

<div th:replace="~{fragments/client_header :: client_header}"></div>

<header class="shop-header shadow-sm">
  <div class="container text-center">
    <h2 class="fw-bold mb-4">
      Our Fresh <span class="text-success" th:text="${currentCategory != null ? currentCategory : 'Marketplace'}">Marketplace</span>
    </h2>

    <div class="category-filter">
      <a th:href="@{/client/shop}"
         th:classappend="${currentCategory == null} ? 'active' : ''"
         class="filter-btn">All Products</a>

      <a th:each="cat : ${categoryList}"
         th:href="@{/client/category(type=${cat.name})}"
         th:classappend="${currentCategory == cat.name} ? 'active' : ''"
         class="filter-btn text-capitalize"
         th:text="${cat.name}">Category</a>
    </div>
  </div>
</header>

<section class="container mb-5">
  <div th:if="${#lists.isEmpty(productList)}" class="text-center py-5">
    <img th:src="@{/images/cat-3.png}" style="width: 100px; opacity: 0.5;">
    <h4 class="mt-3 text-muted">No products found in this category.</h4>
    <a th:href="@{/client/shop}" class="btn btn-success mt-2">Back to Shop</a>
  </div>

  <div class="row g-4">
    <div class="col-6 col-md-4 col-lg-3" th:each="product : ${productList}" th:if="${product.active}">
      <div class="product-card h-100 shadow-sm border-0 position-relative">

        <div class="price-badge">₹<span th:text="${product.price}">0</span></div>

        <a th:href="@{/client/product/view(id=${product.id})}" class="view-link">
          <i class="fas fa-eye"></i>
        </a>

        <div class="image-holder">
          <img th:with="imageList=${#strings.arraySplit(product.image, ',')}"
               th:src="${product.image != null && product.image != ''} ? @{'/uploads/' + ${imageList[0]}} : @{/images/default.png}"
               class="product-img"
               onerror="this.src='/images/cat-3.png';"
               th:alt="${product.productName}">
        </div>

        <div class="p-4 pt-0 text-center">
          <h6 class="fw-bold text-dark mb-1 text-truncate" th:text="${product.productName}">Product Name</h6>
          <p class="small text-muted mb-3" th:text="'₹' + ${product.price} + ' per ' + ${product.units}">₹0 per kg</p>



          <!-- CART FORM (The only one that needs a Qty box) -->
          <form th:action="@{/cart/add}" method="POST" class="flex-grow-1">
            <input type="hidden" name="pid" th:value="${product.id}">

            <div class="d-flex align-items-center justify-content-center mb-3">
              <span class="small text-muted me-2">Qty:</span>
              <input type="number" name="p_qty" min="1" th:max="${product.stock}" value="1"
                     class="form-control form-control-sm text-center"
                     style="width: 70px; border-radius: 8px; font-weight: 600; border: 1px solid #eee;">
            </div>

            <button type="submit" class="btn btn-success w-100" th:disabled="${product.stock == 0}">
              <i class="fas fa-shopping-cart me-1"></i>
              <span th:text="${product.stock > 0 ? 'Add' : 'Out of Stock'}">Add</span>
            </button>
          </form>

          <!-- WISHLIST FORM -->
          <form th:action="@{/client/wishlist/add}" method="POST" class="mb-2">
            <input type="hidden" name="pid" th:value="${product.id}">
            <button type="submit" class="btn-wishlist"
                    th:classappend="${wishlistedIds != null and #lists.contains(wishlistedIds, product.id)} ? 'is-active' : ''">
              <i th:class="${wishlistedIds != null and #lists.contains(wishlistedIds, product.id)} ? 'fas fa-heart text-danger' : 'far fa-heart'"></i>
              <span th:text="${wishlistedIds != null and #lists.contains(wishlistedIds, product.id)} ? ' Saved' : ' Wishlist'"></span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">
  /*<![CDATA[*/
  document.addEventListener('DOMContentLoaded', function() {

      // Select all visible quantity inputs
      const qtyInputs = document.querySelectorAll('.qty-input');

      qtyInputs.forEach(input => {
          // Sync on change, input, or blur to be safe
          ['change', 'input', 'blur'].forEach(evt => {
              input.addEventListener(evt, function() {
                  // Find the closest product card container
                  const card = this.closest('.product-card');
                  // Find the hidden input inside the Cart Form
                  const hiddenQty = card.querySelector('input[name="p_qty"]');

                  if(hiddenQty) {
                      hiddenQty.value = this.value;
                  }
              });
          });
      });

      // Backup: Final sync check when any "Add to Cart" button is clicked
      const cartButtons = document.querySelectorAll('.btn-success');
      cartButtons.forEach(btn => {
          btn.addEventListener('click', function() {
              const card = this.closest('.product-card');
              const visibleQty = card.querySelector('.qty-input').value;
              const hiddenQty = card.querySelector('input[name="p_qty"]');
              if(hiddenQty) {
                  hiddenQty.value = visibleQty;
              }
          });
      });
  });
  /*]]>*/
</script>

</body>
</html>
