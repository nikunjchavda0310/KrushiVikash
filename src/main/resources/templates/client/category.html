<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category | KrushiVikash</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body { background-color: #f8f9fa; font-family: 'Poppins', sans-serif; }

    /* Category Hero Header */
    .category-header {
      background: linear-gradient(rgba(39, 174, 96, 0.8), rgba(39, 174, 96, 0.8)), url('/images/category-bg.jpg');
      background-size: cover;
      background-position: center;
      padding: 60px 0;
      color: white;
      text-align: center;
      margin-bottom: 50px;
      border-radius: 0 0 50px 50px;
    }

    /* Product Card Modernization */
    .product-card {
      background: #fff;
      border: none;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      transition: 0.3s ease;
      height: 100%;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 35px rgba(39, 174, 96, 0.15);
    }

    .image-container {
      height: 200px;
      overflow: hidden;
      background: #fdfdfd;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .product-img {
      max-height: 80%;
      transition: 0.5s;
    }

    .product-card:hover .product-img {
      transform: scale(1.1);
    }

    /* Floating UI Elements */
    .price-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #e74c3c;
      color: white;
      padding: 5px 15px;
      border-radius: 30px;
      font-weight: 700;
      z-index: 10;
    }

    .quick-view {
      position: absolute;
      top: 15px;
      right: 15px;
      background: white;
      color: #27ae60;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.3s;
      z-index: 10;
    }

    .quick-view:hover {
      background: #27ae60;
      color: white;
    }

    /* Form Controls */
    .qty-box {
      border-radius: 10px;
      border: 1px solid #eee;
      text-align: center;
      font-weight: 600;
    }

    .btn-cart {
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px;
      font-weight: 600;
      width: 100%;
      transition: 0.3s;
    }

    .btn-wishlist {
      background: #f8f9fa;
      color: #666;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 8px;
      width: 100%;
      margin-bottom: 8px;
      font-size: 0.9rem;
      transition: 0.3s;
    }

    .btn-wishlist:hover {
      background: #ff7675;
      color: white;
      border-color: #ff7675;
    }

    /* Modern active state for Wishlist button */
.btn-wishlist.is-active {
    background: #fff5f5 !important; /* Soft red background */
    color: #e74c3c !important;     /* Bright red text */
    border-color: #fab1a0 !important;
    font-weight: 600;
}

.btn-wishlist.is-active i {
    color: #e74c3c !important;
    transform: scale(1.1);
    transition: transform 0.2s ease;
}

.btn-wishlist:active {
    transform: scale(0.95);
}
  </style>
</head>
<body>

<div th:replace="~{fragments/client_header :: client_header}"></div>

<header class="category-header shadow-sm">
  <div class="container">
    <h1 class="display-5 fw-bold mb-2">Product Categories</h1>
    <p class="lead">Freshly picked items just for you</p>
  </div>
</header>

<section class="container mb-5">
  <div class="row g-4">
    <div class="col-6 col-md-4 col-lg-3" th:each="p : ${products}" th:if="${p.active}">
      <div class="product-card">
        <div class="price-badge" th:text="'₹' + ${p.price}">₹0</div>

        <a th:href="@{/view_page(id=${p.id})}" class="quick-view">
          <i class="fas fa-eye"></i>
        </a>

        <div class="image-container">
          <img th:with="rawImg=${p.image},
                        firstImg=${#strings.contains(rawImg, ',') ? #strings.arraySplit(rawImg, ',')[0] : rawImg}"
               th:src="@{'/uploads/' + ${firstImg}}"
               class="product-img"
               alt="product image">
        </div>

        <div class="p-3 text-center">
          <h6 class="fw-bold mb-3 text-dark" th:text="${p.productName}">Product Name</h6>

          <form th:action="@{/client/wishlist/add}" method="POST" class="mb-2">
            <input type="hidden" name="pid" th:value="${p.id}">

            <button type="submit" class="btn btn-wishlist"
                    th:classappend="${wishlistedIds != null and #lists.contains(wishlistedIds, p.id)} ? 'active-red' : ''">

              <i th:class="${wishlistedIds != null and #lists.contains(wishlistedIds, p.id)} ? 'fas fa-heart me-1 text-danger' : 'far fa-heart me-1'"></i>
              <span th:text="${wishlistedIds != null and #lists.contains(wishlistedIds, p.id)} ? 'Saved' : 'Wishlist'">Wishlist</span>

            </button>
          </form>

          <form th:action="@{/cart/add}" method="POST">
            <div class="d-flex align-items-center mb-3">
              <span class="small text-muted me-2">Qty:</span>
              <input type="number" min="1" value="1" name="p_qty" class="form-control form-control-sm qty-box">
            </div>
            <input type="hidden" name="pid" th:value="${p.id}">

            <button type="submit" class="btn btn-cart"
                    th:disabled="${p.stock == 0}">
              <i class="fas fa-cart-plus me-2"></i>
              <span th:text="${p.stock > 0 ? 'Add to Cart' : 'Out of Stock'}">Add to Cart</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(products)}">
      <p class="text-muted">No products available in this category currently.</p>
    </div>
  </div>
</section>



<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
