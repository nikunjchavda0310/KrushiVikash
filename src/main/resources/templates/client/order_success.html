<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | KrushiVikash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary-green: #27ae60; --light-green: #f8fff9; --dark-navy: #2c3e50; }
        body { background-color: #f8f9fa; font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background-image: radial-gradient(#27ae6010 1px, transparent 1px); background-size: 30px 30px; }
        .success-container { max-width: 600px; width: 95%; padding: 20px; }
        .success-card { background: white; padding: 50px 30px; border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.05); text-align: center; border: 1px solid #f1f1f1; position: relative; overflow: hidden; }
        .success-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: linear-gradient(90deg, #2ecc71, #27ae60); }
        .icon-circle { width: 100px; height: 100px; background: var(--light-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px; color: var(--primary-green); font-size: 50px; animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55); }

        @keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .order-summary-box { background: #f8fbf9; border-radius: 20px; padding: 20px; margin-bottom: 30px; border: 1px dashed #27ae6060; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; color: #636e72; }
        .summary-value { font-weight: 700; color: var(--dark-navy); }

        .btn-action { padding: 15px 35px; border-radius: 15px; font-weight: 600; transition: all 0.3s ease; text-decoration: none; display: inline-block; width: 100%; margin-bottom: 10px; }
        .btn-orders { background: var(--primary-green); color: white; border: none; box-shadow: 0 10px 20px rgba(39, 174, 96, 0.2); }
        .btn-orders:hover { background: #219150; transform: translateY(-2px); color: white; }
        .btn-shop { background: transparent; color: #95a5a6; border: 2px solid #e0e0e0; }
        .btn-shop:hover { border-color: var(--primary-green); color: var(--primary-green); background: var(--light-green); }
    </style>
</head>
<body>

<div class="success-container">
    <div class="success-card">
        <div class="icon-circle">
            <i class="fas fa-check"></i>
        </div>

        <h1 class="fw-bold text-dark mb-2">Order Confirmed!</h1>
        <p class="text-muted mb-4">Thank you for supporting local farmers. Your order has been placed successfully.</p>

        <div class="order-summary-box shadow-sm">
            <div class="summary-item">
                <span>Order ID:</span>
                <span class="summary-value" th:text="'#' + ${orderId}">#000</span>
            </div>
            <div class="summary-item">
                <span>Amount Paid:</span>
                <span class="summary-value text-success" th:text="'₹' + ${total}">₹0.00</span>
            </div>
            <div class="summary-item" th:if="${paymentMessage}">
                <span>Payment:</span>
                <span class="summary-value text-uppercase small" th:text="${paymentMessage}">CREDIT CARD</span>
            </div>
        </div>

        <div class="action-buttons">
            <a th:href="@{/client/orders}" class="btn-action btn-orders">
                <i class="fas fa-box-open me-2"></i> Track My Orders
            </a>
            <a th:href="@{/client/shop}" class="btn-action btn-shop">
                <i class="fas fa-shopping-basket me-2"></i> Continue Shopping
            </a>
        </div>

        <div class="mt-4 pt-3 border-top">
            <small class="text-muted">A copy of your receipt has been sent to your email.</small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
    window.onload = function() {
        // Professional multi-burst confetti
        var duration = 3 * 1000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 3,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#27ae60', '#2ecc71']
            });
            confetti({
                particleCount: 3,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#27ae60', '#2ecc71']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    };
</script>
</body>
</html>
