<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Messages | KrushiVikash</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #f0f2f5;
      font-family: 'Poppins', sans-serif;
    }

    .admin-container {
      padding: 40px 0;
    }

    .section-title {
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 30px;
      position: relative;
      display: inline-block;
    }

    .section-title::after {
      content: '';
      width: 50%;
      height: 4px;
      background: #27ae60;
      position: absolute;
      bottom: -10px;
      left: 0;
      border-radius: 2px;
    }

    /* Message Card Design */
    .message-card {
      background: #ffffff;
      border: none;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      transition: 0.3s;
      height: 100%;
      border-top: 5px solid #27ae60;
    }

    .message-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .card-label {
      font-weight: 600;
      color: #7f8c8d;
      font-size: 0.8rem;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .card-value {
      color: #2c3e50;
      font-weight: 500;
      margin-bottom: 15px;
      word-break: break-all;
    }

    .message-text {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      border-left: 3px solid #dee2e6;
      font-style: italic;
      color: #555;
    }

    .delete-btn-modern {
      background: #ff7675;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      width: 100%;
      text-align: center;
      transition: 0.3s;
    }

    .delete-btn-modern:hover {
      background: #d63031;
      color: white;
      box-shadow: 0 4px 12px rgba(214, 48, 49, 0.3);
    }

    .user-badge {
      background: #e1f5fe;
      color: #03a9f4;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/client_header :: client_header}"></div>

<div class="container admin-container">
  <h2 class="section-title">Inquiry Messages</h2>

  <div class="row g-4 mt-2">
    <div class="col-lg-4 col-md-6">
      <div class="message-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="user-badge">User ID: #1</span>
          <i class="fas fa-envelope-open-text text-muted"></i>
        </div>

        <div class="mb-2">
          <div class="card-label">Full Name</div>
          <div class="card-value">John Doe</div>
        </div>

        <div class="row">
          <div class="col-6">
            <div class="card-label">Number</div>
            <div class="card-value">1234567890</div>
          </div>
          <div class="col-6">
            <div class="card-label">Email</div>
            <div class="card-value">johndoe@example.com</div>
          </div>
        </div>

        <div class="mb-4">
          <div class="card-label">Message Content</div>
          <div class="message-text">
            "Hello, I have a question about my order."
          </div>
        </div>

        <a th:href="@{/delete_message(id=1)}"
           onclick="return confirm('Permanently delete this message?');"
           class="delete-btn-modern">
          <i class="fas fa-trash-alt me-2"></i> Delete Message
        </a>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
