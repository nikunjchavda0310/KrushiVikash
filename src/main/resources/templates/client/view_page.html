<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | KrushiVikash</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <style>
    body { background-color: #f8fafb; font-family: 'Poppins', sans-serif; }
    .product-view-container { padding: 60px 0 30px 0; }

    .view-card {
      background: #fff; border-radius: 40px; overflow: hidden;
      box-shadow: 0 30px 70px rgba(0,0,0,0.07); border: none;
    }

    /* Image Side */
    .product-image-side {
      background: #ffffff; display: flex; align-items: center;
      justify-content: center; padding: 40px; border-right: 1px solid #f1f1f1;
    }
    .carousel-item img {
      max-height: 500px; width: 100%; object-fit: contain; cursor: zoom-in;
    }

    /* Details Side */
    .product-details-side { padding: 60px; background: #fff; }
    .category-label {
      color: #27ae60; font-weight: 700; text-transform: uppercase;
      font-size: 0.85rem; letter-spacing: 2px; background: #eafaf1;
      display: inline-block; padding: 4px 12px; border-radius: 8px;
    }
    .product-title { font-size: 2.8rem; font-weight: 700; color: #2c3e50; margin: 15px 0; }
    .current-price { font-size: 2.8rem; font-weight: 700; color: #27ae60; }

    /* Quantity & Share */
    .qty-container { display: flex; align-items: center; background: #f1f3f5; padding: 5px; border-radius: 15px; width: fit-content; }
    .qty-btn { width: 45px; height: 45px; border-radius: 12px; border: none; background: #fff; color: #27ae60; font-weight: bold; }
    .btn-add-cart { background: #27ae60; color: white; padding: 18px 45px; border-radius: 18px; font-weight: 700; border: none; flex-grow: 1; }

    .share-icon { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: white; margin-right: 8px; text-decoration: none; }
    .whatsapp { background: #25D366; } .facebook { background: #1877F2; }

    /* RELATED PRODUCTS STYLING */
    .related-section { padding-bottom: 80px; }
    .section-title { font-weight: 700; color: #2c3e50; margin-bottom: 30px; position: relative; }
    .section-title::after { content: ''; width: 60px; height: 4px; background: #27ae60; position: absolute; bottom: -10px; left: 0; border-radius: 2px; }

    .related-card {
      background: white; border-radius: 20px; transition: 0.3s; border: 1px solid #f1f1f1; overflow: hidden;
    }
    .related-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
    .related-img-box { background: #f9f9f9; padding: 20px; height: 200px; display: flex; align-items: center; justify-content: center; }
    .related-img-box img { max-height: 100%; max-width: 100%; object-fit: contain; }
    .related-body { padding: 20px; }
    .related-name { font-weight: 600; color: #2c3e50; text-decoration: none; display: block; margin-bottom: 5px; }
    .related-price { color: #27ae60; font-weight: 700; font-size: 1.1rem; }

    .modal { z-index: 9999 !important; }
    .modal-backdrop { z-index: 9998 !important; }

    .btn-wishlist {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      border: 2px solid #eee;
      background: white;
      color: #e74c3c;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }

    .btn-wishlist:hover {
      background: #fff5f5;
      border-color: #e74c3c;
      transform: scale(1.05);
    }

    .btn-wishlist.is-active {
        background: #fff5f5 !important;
        color: #e74c3c !important;
        border-color: #fab1a0 !important;
        font-weight: 600;
    }

    .btn-wishlist.is-active i {
        color: #e74c3c !important;
        transform: scale(1.1);
        transition: transform 0.2s ease;
    }

    .btn-wishlist:active {
        transform: scale(0.95);
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/client_header :: client_header}"></div>

<div class="container product-view-container">
  <div class="view-card row g-0">
    <div class="col-lg-6 product-image-side">
      <div id="productCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div th:each="imgName, iterStat : ${#strings.arraySplit(product.image, ',')}"
               th:class="${iterStat.first} ? 'carousel-item active' : 'carousel-item'">
            <img th:src="@{'/uploads/' + ${imgName}}" onerror="this.src='/images/cat-3.png';" data-bs-toggle="modal" th:data-bs-target="'#zoomModal' + ${iterStat.index}">
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-6 product-details-side">

      <div th:if="${product.active}">
            <span th:if="${product.stock > 0}" class="status-badge" style="display:inline-block; padding: 8px 18px; background: #e8f5e9; color: #2e7d32; border-radius: 12px; font-weight: 600; margin-bottom: 20px;">
                <i class="fas fa-check-circle me-2"></i> In Stock
            </span>
        <span th:if="${product.stock <= 0}" class="status-badge" style="display:inline-block; padding: 8px 18px; background: #ffebee; color: #c62828; border-radius: 12px; font-weight: 600; margin-bottom: 20px;">
                <i class="fas fa-times-circle me-2"></i> Out of Stock
            </span>
      </div>

      <div th:unless="${product.active}" class="alert alert-danger rounded-4 shadow-sm border-0 mb-4 p-3 d-flex align-items-center animate__animated animate__shakeX">
        <i class="fas fa-eye-slash me-3 fa-2x"></i>
        <div>
          <h6 class="fw-bold mb-0">Currently Offline</h6>
          <small>The farmer has temporarily hidden this product. It cannot be purchased at this time.</small>
        </div>
      </div>

      <div class="category-label" th:text="${product.category.name}">Category</div>
      <h1 class="product-title" th:text="${product.productName}">Product Name</h1>
      <div class="price-display">
        <span class="current-price">₹<span id="basePrice" th:text="${product.price}">0.00</span></span>
        <span class="text-muted"> / per <span th:text="${product.units}">unit</span></span>
      </div>
      <p class="product-description" th:text="${product.description}">Description...</p>

      <form th:action="@{/cart/add}" method="POST">
        <input type="hidden" name="pid" th:value="${product.id}">

        <div class="mb-4">
          <label class="fw-bold mb-2 d-block">Select Quantity</label>
          <div class="d-flex align-items-center gap-3">
            <div class="qty-container">
              <button type="button" class="qty-btn" onclick="updateQty(-1)"><i class="fas fa-minus"></i></button>
              <input type="number" id="p_qty" name="p_qty" value="1" min="1" th:max="${product.stock}"
                     style="width: 60px; text-align: center; border: none; background: transparent; font-weight: 700;" readonly>
              <button type="button" class="qty-btn" onclick="updateQty(1)"><i class="fas fa-plus"></i></button>
            </div>
            <span class="fw-bold text-muted" th:text="${product.units}">kg</span>
          </div>
        </div>

        <div style="background: #f8fafb; padding: 15px 25px; border-radius: 15px; border-left: 5px solid #27ae60;" class="mb-4">
          <small class="text-muted d-block">Subtotal</small>
          <span class="h4 fw-bold text-dark">₹<span id="totalPrice" th:text="${product.price}">0.00</span></span>
        </div>

        <div class="d-flex gap-3 mb-4 align-items-center">
          <button type="submit" class="btn btn-success btn-add-cart" th:disabled="${product.stock == 0}">
            <i class="fas fa-shopping-cart me-2"></i>
            <span th:text="${product.stock > 0 ? 'Add to Cart' : 'Out of Stock'}">Add to Cart</span>
          </button>
        </div>
      </form>
      <form th:action="@{/client/wishlist/add}" method="POST" class="d-inline">
        <input type="hidden" name="pid" th:value="${product.id}">
        <button type="submit"
                class="btn-wishlist"
                th:classappend="${wishlistedIds != null and #lists.contains(wishlistedIds, product.id)} ? 'is-active' : ''"
                th:title="${wishlistedIds != null and #lists.contains(wishlistedIds, product.id)} ? 'Remove from Wishlist' : 'Add to Wishlist'">
          <i th:class="${wishlistedIds != null and #lists.contains(wishlistedIds, product.id)} ? 'fas fa-heart text-danger' : 'far fa-heart text-muted'"></i>
        </button>
      </form>

      <div class="pt-3 border-top mt-4">
        <small class="text-muted d-block mb-2">Share with friends:</small>
        <a href="#" id="waShare" target="_blank" class="share-icon whatsapp"><i class="fab fa-whatsapp"></i></a>
        <a href="#" id="fbShare" target="_blank" class="share-icon facebook"><i class="fab fa-facebook-f"></i></a>
      </div>
    </div>
  </div>
</div>

<div class="container related-section">
  <h3 class="section-title">Related Products</h3>
  <div class="row g-4">
    <div class="col-6 col-md-4 col-lg-3" th:each="related : ${relatedProducts}" th:if="${related.id != product.id and related.active}">
      <div class="related-card h-100">
        <div class="related-img-box">
          <img th:src="@{'/uploads/' + ${#strings.arraySplit(related.image, ',')[0]}}" onerror="this.src='/images/cat-3.png';" th:alt="${related.productName}">
        </div>
        <div class="related-body">
          <a th:href="@{/client/product/view(id=${related.id})}" class="related-name text-truncate" th:text="${related.productName}">Product Name</a>
          <div class="related-price">₹<span th:text="${related.price}">0</span></div>
          <div class="mt-2">
            <a th:href="@{/client/product/view(id=${related.id})}" class="btn btn-sm btn-outline-success w-100 rounded-pill">View Details</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:each="imgName, iterStat : ${#strings.arraySplit(product.image, ',')}">
  <div class="modal fade" th:id="'zoomModal' + ${iterStat.index}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content bg-transparent border-0">
        <div class="modal-body p-0 text-center text-white">
          <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-4" data-bs-dismiss="modal"></button>
          <img th:src="@{'/uploads/' + ${imgName}}" class="img-fluid rounded shadow-lg" style="max-height: 90vh;">
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">
  /*<![CDATA[*/
  document.addEventListener('DOMContentLoaded', () => {

    // 1. Quantity Calculation Logic
    const basePriceElement = document.getElementById('basePrice');
    const qtyInput = document.getElementById('p_qty');
    const totalPriceDisplay = document.getElementById('totalPrice');

    if (basePriceElement && qtyInput) {
        const basePrice = parseFloat(basePriceElement.innerText);

        window.updateQty = function(change) {
            let currentVal = parseInt(qtyInput.value);
            let newQty = currentVal + change;
            let maxStock = parseInt(qtyInput.getAttribute('max')) || 99;

            if (newQty >= 1 && newQty <= maxStock) {
                qtyInput.value = newQty;
                let total = basePrice * newQty;
                totalPriceDisplay.innerText = total.toFixed(2);
            }
        };
    }

    // 2. Share Links Logic
    const url = window.location.href;
    const productName = [[${product.productName}]];
    const encodedUrl = encodeURIComponent(url);
    const shareText = encodeURIComponent("Check out this organic " + productName + " at KrushiVikash: ");

    const waBtn = document.getElementById('waShare');
    const fbBtn = document.getElementById('fbShare');
    if(waBtn) waBtn.href = `https://api.whatsapp.com/send?text=${shareText}${encodedUrl}`;
    if(fbBtn) fbBtn.href = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;
  });
  /*]]>*/
</script>
</body>
</html>
