<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings | KrushiVikash</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body { background-color: #f0f2f5; font-family: 'Poppins', sans-serif; }

    .update-container { padding: 60px 0; }

    .profile-main-card {
      background: #fff;
      border-radius: 20px;
      border: none;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .profile-header {
      background: linear-gradient(135deg, #27ae60 0%, #11998e 100%);
      padding: 40px;
      text-align: center;
      color: white;
    }

    .profile-pic-wrapper {
      position: relative;
      display: inline-block;
      margin-top: -80px;
    }

    .profile-pic-wrapper img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      background-color: white;
    }

    .form-section-title {
      font-weight: 700;
      color: #2c3e50;
      font-size: 1.1rem;
      border-bottom: 2px solid #f1f1f1;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .form-label { font-weight: 600; color: #555; font-size: 0.85rem; }

    .form-control {
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #e0e0e0;
      background-color: #fafafa;
      transition: 0.3s;
    }

    .form-control:focus {
      background-color: #fff;
      border-color: #27ae60;
      box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.1);
    }

    .btn-update {
      background: #27ae60;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 12px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-update:hover {
      background: #219150;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(39, 174, 96, 0.2);
      color: white;
    }

    .btn-back {
      background: #f8f9fa;
      color: #666;
      border: 1px solid #ddd;
      padding: 14px 30px;
      border-radius: 12px;
      font-weight: 600;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-back:hover { background: #e9ecef; color: #333; }
  </style>
</head>
<body>

<div th:replace="~{fragments/client_header :: client_header}"></div>

<div class="container update-container">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="profile-main-card">

        <div class="profile-header">
          <h2 class="fw-bold mb-0">Account Settings</h2>
          <p class="opacity-75">Manage your personal information and security</p>
        </div>

        <form th:action="@{/client/update_profile}" method="POST" enctype="multipart/form-data" class="p-4 p-md-5">

          <div class="text-center mb-5">
            <div class="profile-pic-wrapper">
              <img th:src="${currentUser != null && currentUser.image != null} ? @{'/uploads/' + ${currentUser.image}} : @{/images/pic-1.png}" alt="Profile">
            </div>
            <div class="mt-3 col-md-4 mx-auto">
              <label class="form-label">Change Profile Picture</label>
              <input type="file" name="imageFile" accept="image/*" class="form-control form-control-sm">
            </div>
          </div>

          <div class="row g-5">
            <div class="col-md-6">
              <h5 class="form-section-title"><i class="fas fa-user-circle me-2 text-success"></i> General Info</h5>

              <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="name" th:value="${currentUser != null ? currentUser.name : ''}" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" th:value="${currentUser != null ? currentUser.email : ''}" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Contact Number</label>
                <input type="tel" name="contact" th:value="${currentUser != null ? currentUser.contact : ''}" pattern="[0-9]{10}" class="form-control" placeholder="10-digit number">
              </div>

              <div class="mb-3">
                <label class="form-label">Residential Address</label>
                <input type="text" name="address" th:value="${currentUser != null ? currentUser.address : ''}" class="form-control" required>
              </div>
            </div>

            <div class="col-md-6">
              <h5 class="form-section-title"><i class="fas fa-shield-alt me-2 text-success"></i> Password & Security</h5>

              <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" name="old_pass" class="form-control" placeholder="Required to change password">
              </div>

              <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="new_pass" class="form-control" placeholder="Leave blank to keep same">
              </div>

              <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_pass" class="form-control" placeholder="Confirm new password">
              </div>

              <div class="alert alert-info py-2 px-3 small mt-4 border-0" style="background-color: #e3f2fd; color: #0d47a1;">
                <i class="fas fa-info-circle me-1"></i> Use at least 8 characters with a mix of letters and numbers for a strong password.
              </div>
            </div>
          </div>

          <hr class="my-5">

          <div class="d-flex flex-column flex-md-row justify-content-center gap-3">
            <button type="submit" name="update_profile" class="btn btn-update px-5 shadow-sm">
              <i class="fas fa-save me-2"></i> Save Changes
            </button>
            <a th:href="@{/client/index}" class="btn btn-back px-5">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>



<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
