<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | KrushiVikash</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; font-family: 'Poppins', sans-serif; }
    .orders-container { padding: 50px 0; }
    .order-card { background: #ffffff; border-radius: 20px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: 0.3s; margin-bottom: 25px; overflow: hidden; }
    .order-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
    .order-header { background: #f8fdfa; padding: 20px 30px; border-bottom: 1px solid #edf2f0; display: flex; justify-content: space-between; align-items: center; }
    .order-body { padding: 30px; }
    .status-badge { padding: 6px 15px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; }

    /* Updated Status Colors */
    .status-pending { background: #fff9eb; color: #f39c12; border: 1px solid #fde68a; } /* Waiting for Farmer */
    .status-completed { background: #f0fff4; color: #27ae60; border: 1px solid #9ae6b4; } /* Verified/Paid */
    .status-cod { background: #ebf8ff; color: #3182ce; border: 1px solid #bee3f8; } /* COD */

    .order-detail-label { font-size: 0.8rem; color: #95a5a6; text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
    .order-detail-value { color: #2c3e50; font-weight: 500; margin-bottom: 20px; }
    .price-large { font-size: 1.5rem; font-weight: 700; color: #27ae60; }
    .utr-text { font-family: monospace; background: #f1f2f6; padding: 2px 6px; border-radius: 4px; color: #57606f; font-size: 0.9rem; }
  </style>
</head>
<body>

<div th:replace="~{fragments/client_header :: client_header}"></div>

<div class="container orders-container">
  <h2 class="fw-bold mb-5 text-center">My <span class="text-success">Order History</span></h2>

  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div th:each="order : ${orders}" class="order-card">
        <div class="order-header">
          <div>
            <span class="order-detail-label d-block">Placed On</span>
            <span class="fw-bold text-dark" th:text="${#temporals.format(order.orderDate, 'dd-MMM-yyyy')}"></span>
          </div>

          <span th:if="${order.status == 'VERIFIED_PAID'}" class="status-badge status-completed">
      <i class="fas fa-check-double"></i> Verified / Paid
  </span>

          <span th:if="${order.status == 'PARTIALLY_VERIFIED'}" class="status-badge status-pending">
      <i class="fas fa-hourglass-half"></i> Partially Verified
  </span>

          <span th:if="${order.status == 'AWAITING_FARMER_CHECK' or order.status == 'PENDING'}" class="status-badge status-cod">
      Awaiting Farmer Check
  </span>
        </div>

        <div class="order-body">
          <div class="row">
            <div class="col-md-4">
              <div class="order-detail-label">Customer Details</div>
              <div class="order-detail-value">
                <span th:text="${order.shippingName}">John Doe</span> <br>
                <small class="text-muted" th:text="${order.shippingPhone}">+91 1234567890</small> <br>
                <small class="text-muted" th:text="${order.shippingEmail}">john@example.com</small>
              </div>
            </div>

            <div class="col-md-4">
              <div class="order-detail-label">Shipping Address</div>
              <div class="order-detail-value small" th:text="${order.shippingAddress}">Mumbai, India</div>

              <div class="order-detail-label">Payment Method</div>
              <div class="order-detail-value small">
                <span th:text="${order.paymentMethod}">UPI</span>
                <div th:if="${order.transactionId != null}" class="mt-1">
                  <small class="text-muted">UTR:</small> <span class="utr-text" th:text="${order.transactionId}">123456789012</span>
                </div>
              </div>
            </div>

            <div class="col-md-4 text-md-end">
              <div class="order-detail-label">Total Amount</div>
              <div class="price-large mb-3" th:text="'₹' + ${order.totalAmount}">₹0.00</div>

              <div class="mt-3">
                <button class="btn btn-success btn-sm px-3"
                        data-bs-toggle="modal"
                        data-bs-target="#orderModal"
                        th:attr="data-order-id=${order.id}"
                        onclick="initOrderFetch(this)">
                  <i class="fas fa-list me-1"></i> View Details
                </button>

                <a th:href="@{'/client/order/invoice/' + ${order.id}}" class="btn btn-outline-dark btn-sm px-3 ms-2">
                  <i class="fas fa-file-invoice me-1"></i> Invoice
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="orderModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title fw-bold">Order Items</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0" id="modalContent">
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Script remains exactly the same as your provided code
  const observer = new MutationObserver((mutations) => {
    mutations.forEach((mutation) => {
      if (mutation.type === 'attributes' && mutation.attributeName === 'aria-hidden') {
        const modal = document.getElementById('orderModal');
        if (modal.getAttribute('aria-hidden') === 'true') {
          modal.removeAttribute('aria-hidden');
        }
      }
    });
  });

  document.addEventListener('DOMContentLoaded', () => {
    const modalElement = document.getElementById('orderModal');
    observer.observe(modalElement, { attributes: true });
  });

  function initOrderFetch(button) {
    const orderId = button.getAttribute('data-order-id');
    const content = document.getElementById('modalContent');

    content.innerHTML = `
      <div class="text-center py-5">
        <div class="spinner-border text-success" role="status"></div>
        <p class="mt-2 text-muted">Loading items...</p>
      </div>`;

    fetch('/client/order-details/' + orderId)
      .then(res => {
        if (!res.ok) throw new Error("HTTP error " + res.status);
        return res.json();
      })
      .then(items => {
        if (!items || items.length === 0) {
          content.innerHTML = '<div class="p-4 text-center">No items found for this order.</div>';
          return;
        }
        renderItems(items, content);
      })
      .catch(err => {
        console.error("Fetch Error:", err);
        content.innerHTML = `<div class="p-4 text-center text-danger">Error: Could not load data.</div>`;
      });
  }

  function renderItems(items, container) {
    let html = '<ul class="list-group list-group-flush shadow-sm">';
    let grandTotal = 0;

    items.forEach(item => {
        const name = item.productName || "Unknown Product";
        const qty = item.quantity || 1;
        const price = item.price || 0;
        const totalLine = price * qty;
        grandTotal += totalLine;

        html += `
            <li class="list-group-item d-flex justify-content-between align-items-center p-3 border-bottom">
                <div class="me-auto">
                    <div class="fw-bold text-dark" style="font-size: 1.05rem;">${name}</div>
                    <small class="text-muted">Qty: ${qty} × ₹${price.toFixed(2)}</small>
                </div>
                <div class="text-end"><span class="text-dark fw-bold">₹${totalLine.toFixed(2)}</span></div>
            </li>`;
    });

    html += `
        <li class="list-group-item d-flex justify-content-between align-items-center p-3 bg-light">
            <div class="fw-bold text-uppercase text-muted" style="letter-spacing: 1px; font-size: 0.85rem;">Order Total</div>
            <div class="text-end"><span class="text-success fw-bold" style="font-size: 1.4rem;">₹${grandTotal.toFixed(2)}</span></div>
        </li>`;
    html += '</ul>';
    container.innerHTML = html;
}
</script>
</body>
</html>
