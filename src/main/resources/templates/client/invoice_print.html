<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invoice - KrushiVikash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f4f4; padding: 30px; font-family: 'serif'; }
        .invoice-box {
            background: #fff;
            padding: 40px;
            max-width: 850px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .text-success { color: #27ae60 !important; }
        .table thead { background-color: #f8f9fa; }

        /* This magic hides things when printing */
        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .invoice-box { box-shadow: none; border: none; width: 100%; max-width: 100%; }
        }
    </style>
</head>
<body onload="window.print()"> <div class="invoice-box">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="fw-bold text-success mb-0">KrushiVikash</h1>
            <p class="text-muted">Direct from Farm to Table</p>
        </div>
        <div class="text-end">
            <h2 class="fw-light">INVOICE</h2>
            <p class="mb-0"><strong>ID:</strong> <span th:text="'#KV-' + ${order.id}"></span></p>
            <p><strong>Date:</strong> <span th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy')}"></span></p>
        </div>
    </div>

    <div class="row mb-5">
        <div class="col-6">
            <h6 class="text-uppercase text-muted small fw-bold">Billed To:</h6>
            <p class="mb-0"><strong th:text="${order.shippingName}"></strong></p>
            <p class="mb-0" th:text="${order.shippingPhone}"></p>
            <p th:text="${order.shippingAddress}"></p>
        </div>
        <div class="col-6 text-end">
            <h6 class="text-uppercase text-muted small fw-bold">Payment Status:</h6>
            <p class="fw-bold mb-0" th:text="${order.status}"></p>
            <p class="text-muted small" th:text="'via ' + ${order.paymentMethod}"></p>
        </div>
    </div>

    <table class="table table-hover border">
        <thead>
        <tr>
            <th>Item Description</th>
            <th class="text-center">Quantity</th>
            <th class="text-end">Unit Price</th>
            <th class="text-end">Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.orderItems}">
            <td th:text="${item.product.productName}">Product Name</td>
            <td class="text-center" th:text="${item.quantity}">1</td>
            <td class="text-end" th:text="'₹' + ${item.priceAtPurchase}">₹0</td>
            <td class="text-end" th:text="'₹' + ${item.priceAtPurchase * item.quantity}">₹0</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="3" class="text-end py-3">Grand Total</th>
            <th class="text-end text-success fs-4 py-3" th:text="'₹' + ${order.totalAmount}">₹0</th>
        </tr>
        </tfoot>
    </table>

    <div class="mt-5 text-center">
        <p class="text-muted small">Thank you for supporting local farmers!</p>
        <div class="no-print mt-4">
            <button class="btn btn-success px-4 rounded-pill me-2" onclick="window.print()">
                <i class="fas fa-print me-2"></i> Print Again
            </button>
            <a href="/client/orders" class="btn btn-outline-secondary px-4 rounded-pill">
                Back to Orders
            </a>
        </div>
    </div>
</div>

</body>
</html>
