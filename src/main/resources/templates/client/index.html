<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | KrushiVikash</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #27ae60;
            --dark-text: #2c3e50;
        }

        body { font-family: 'Poppins', sans-serif; background-color: #fbfbfb; color: var(--dark-text); }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        .hero-banner {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('/images/home-bg.jpg');
            background-size: cover; background-position: center;
            height: 60vh; display: flex; align-items: center; color: white;
            border-radius: 0 0 40px 40px;
            margin-bottom: -50px;
        }

        .hero-banner h3 { font-size: 3.5rem; margin-bottom: 1.5rem; }

        .modern-card {
            border: none; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: 0.3s; background: white; overflow: hidden;
        }
        .modern-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(39,174,96,0.12); }

        .cat-box img { height: 100px; object-fit: contain; transition: 0.3s; }
        .modern-card:hover .cat-box img { transform: scale(1.1); }

        .product-img { height: 180px; object-fit: cover; width: 100%; }

        .price-tag { background: #e74c3c; color: white; padding: 4px 12px; border-radius: 0 15px 15px 0; position: absolute; top: 15px; left: 0; font-weight: 600; }
        .view-btn { position: absolute; top: 15px; right: 15px; background: white; color: var(--primary-green); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        .btn-organic { background: var(--primary-green); color: white; border-radius: 12px; padding: 10px; font-weight: 600; border: none; width: 100%; transition: 0.3s; }
        .btn-organic:hover { background: #219150; transform: scale(1.02); }

        .btn-wishlist { background: #fef5e7; color: #f39c12; border: 1px solid #f39c12; border-radius: 12px; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .btn-wishlist:hover { background: #f39c12; color: white; }

        .qty-input { border-radius: 8px; border: 1px solid #eee; text-align: center; font-weight: 600; }

        /* Modern active state for Wishlist button */
        .btn-wishlist.is-active {
            background: #fff5f5 !important;
            color: #e74c3c !important;
            border-color: #fab1a0 !important;
            font-weight: 600;
        }

        .btn-wishlist.is-active i {
            color: #e74c3c !important;
            transform: scale(1.1);
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/client_header :: client_header}"></div>

<div class="hero-banner">
    <div class="container text-center">
        <span class="text-warning fw-bold text-uppercase tracking-widest">Fresh from the farm</span>
        <h3>Reach For A Healthier You</h3>
        <a th:href="@{/about}" class="btn btn-outline-light rounded-pill px-5 py-2">Learn About Us</a>
    </div>
</div>

<section class="container" style="margin-top: 100px;">
    <h2 class="text-center mb-5 fw-bold">Shop by <span class="text-success">Category</span></h2>
    <div class="row g-4 justify-content-center">
        <div class="col-6 col-md-3 col-lg-2" th:each="cat : ${categoryList}">
            <a th:href="@{/client/category(type=${cat.name})}" class="text-decoration-none">
                <div class="modern-card p-4 text-center cat-box h-100 shadow-sm">
                    <div class="image-container mb-3">
                        <img th:if="${cat.name.toLowerCase() == 'fruits'}" th:src="@{/images/cat-1.png}" alt="Fruits" class="img-fluid">
                        <img th:if="${cat.name.toLowerCase() == 'vegitables' or cat.name.toLowerCase() == 'vegetables'}" th:src="@{/images/beans.jpg}" alt="Vegetables" class="img-fluid">
                        <img th:if="${cat.name.toLowerCase() != 'fruits' && cat.name.toLowerCase() != 'vegitables' && cat.name.toLowerCase() != 'vegetables'}" th:src="@{/images/cat-3.png}" alt="Other" class="img-fluid">
                    </div>
                    <h5 class="text-dark fw-bold text-capitalize" th:text="${cat.name}">Category Name</h5>
                </div>
            </a>
        </div>
    </div>
</section>

<section class="container py-5 mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Latest <span class="text-success">Harvest</span></h2>
        <a th:href="@{/client/shop}" class="text-success fw-bold text-decoration-none">View All <i class="fas fa-arrow-right"></i></a>
    </div>

    <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" th:each="product : ${productList}" th:if="${product.active}">
            <div class="modern-card position-relative h-100 shadow-sm border-0">

                <div class="price-tag">₹<span th:text="${product.price}">15</span>/-</div>

                <a th:href="@{/client/product/view(id=${product.id})}" class="view-btn">
                    <i class="fas fa-eye"></i>
                </a>

                <div class="text-center p-3">
                    <img th:with="firstImage=${product.image != null && !product.image.isEmpty() ? #strings.arraySplit(product.image, ',')[0] : 'default.png'}"
                         th:src="@{'/uploads/' + ${firstImage}}"
                         class="product-img img-fluid"
                         style="height: 180px; width: 100%; object-fit: contain;"
                         onerror="this.src='/images/cat-3.png';"
                         alt="product-image">
                </div>

                <div class="p-4 pt-0">
                    <h5 class="mb-2 fw-bold text-truncate" th:text="${product.productName}">Product Name</h5>
                    <p class="small text-muted mb-2" th:text="'Per ' + ${product.units}">Per kg</p>

                    <div class="d-flex gap-2 align-items-end">
                        <form th:action="@{/cart/add}" method="POST" class="flex-grow-1">
                            <input type="hidden" name="pid" th:value="${product.id}">

                            <div class="mb-2">
                                <label class="small text-muted d-block mb-1">Qty:</label>
                                <input type="number" name="p_qty" min="1" th:max="${product.stock}" value="1"
                                       class="form-control form-control-sm qty-input" style="width: 70px;">
                            </div>

                            <button type="submit" class="btn btn-success w-100" th:disabled="${product.stock == 0}">
                                <i class="fas fa-shopping-cart me-1"></i>
                                <span th:text="${product.stock > 0 ? 'Add' : 'Out of Stock'}">Add</span>
                            </button>
                        </form>

                        <form th:action="@{/client/wishlist/add}" method="POST" class="mb-0">
                            <input type="hidden" name="pid" th:value="${product.id}">
                            <button type="submit" class="btn-wishlist"
                                    th:classappend="${wishlistedIds != null and #lists.contains(wishlistedIds, product.id)} ? 'is-active' : ''"
                                    style="height: 38px; width: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #eee; background: white;">
                                <i th:class="${wishlistedIds != null and #lists.contains(wishlistedIds, product.id)} ? 'fas fa-heart text-danger' : 'far fa-heart'"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Initialize Toast
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            didOpen: (toast) => {
                toast.addEventListener('mouseenter', Swal.stopTimer)
                toast.addEventListener('mouseleave', Swal.resumeTimer)
            }
        });

        // 2. Capture Data from Controller
        const message = [[${message}]];
        const info = [[${info}]];
        const error = [[${error}]];
        const urlParams = new URLSearchParams(window.location.search);

        // 3. Show Alerts/Toasts
        if (urlParams.has('loginSuccess')) {
            Swal.fire({ title: 'Welcome Back!', text: 'Enjoy fresh shopping!', icon: 'success', confirmButtonColor: '#27ae60' });
        }

        if (message) { Toast.fire({ icon: 'success', title: message }); }
        if (info) { Toast.fire({ icon: 'info', title: info }); }
        if (error) { Toast.fire({ icon: 'error', title: error }); }
    });
    /*]]>*/
</script>
</body>
</html>
