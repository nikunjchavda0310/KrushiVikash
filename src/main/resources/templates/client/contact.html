<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us | KrushiVikash</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body { background-color: #fbfbfb; font-family: 'Poppins', sans-serif; }
    .contact-container { padding: 80px 0; }
    .contact-card {
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05);
      border: none;
    }

    /* Left Side: Info */
    .contact-info-side {
      background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%);
      color: white;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .info-item { display: flex; align-items: center; margin-bottom: 25px; }
    .info-item i {
      width: 50px; height: 50px;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; margin-right: 20px;
    }

    /* Right Side: Form */
    .contact-form-side { padding: 50px; }
    .form-control {
      border-radius: 10px; padding: 12px 15px;
      border: 1px solid #eee; background-color: #fcfcfc;
      transition: 0.3s;
    }
    .form-control:focus {
      border-color: #27ae60;
      box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.1);
      background-color: #fff;
    }

    /* Error Styling */
    .is-invalid { border-color: #dc3545 !important; }
    .invalid-feedback { font-size: 0.75rem; font-weight: 600; }

    .btn-send {
      background: #27ae60; color: white; border: none;
      padding: 12px 30px; border-radius: 10px;
      font-weight: 600; transition: 0.3s; width: 100%;
    }
    .btn-send:hover {
      background: #219150; transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(39, 174, 96, 0.2); color: white;
    }

    .social-links a {
      color: white; font-size: 1.5rem; margin-right: 20px;
      transition: 0.3s; opacity: 0.8;
    }
    .social-links a:hover { opacity: 1; transform: scale(1.2); }

    @media (max-width: 768px) {
      .contact-info-side { padding: 30px; }
      .contact-form-side { padding: 30px; }
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/client_header :: client_header}"></div>

<div class="container contact-container">
  <div class="contact-card row g-0">

    <div class="col-lg-5 contact-info-side">
      <h2 class="fw-bold mb-4">Let's Talk!</h2>
      <p class="mb-5 opacity-75">Have questions about our organic produce or your order? Reach out to us and we'll get back to you within 24 hours.</p>

      <div class="info-item">
        <i class="fas fa-map-marker-alt"></i>
        <div>
          <h6 class="mb-0 fw-bold">Location</h6>
          <small class="opacity-75">Vadodara, Gujarat, India</small>
        </div>
      </div>

      <div class="info-item">
        <i class="fas fa-phone-alt"></i>
        <div>
          <h6 class="mb-0 fw-bold">Phone</h6>
          <small class="opacity-75">+91 98765 43210</small>
        </div>
      </div>

      <div class="info-item">
        <i class="fas fa-envelope"></i>
        <div>
          <h6 class="mb-0 fw-bold">Email</h6>
          <small class="opacity-75">support@krushivikash.com</small>
        </div>
      </div>

      <div class="social-links mt-4">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
      </div>
    </div>

    <div class="col-lg-7 contact-form-side">
      <h3 class="fw-bold mb-4 text-dark">Send a Message</h3>

      <form id="contactForm" novalidate>





        <div class="mb-4">
          <label class="form-label small fw-bold">Your Message</label>
          <textarea name="msg" id="msgInput" class="form-control" required placeholder="How can we help you?" rows="5"></textarea>
          <div class="invalid-feedback">Message cannot be empty.</div>
        </div>

        <button type="button" onclick="sendContactMessage()" class="btn btn-send shadow-sm">
          Send Message <i class="fas fa-paper-plane ms-2"></i>
        </button>
      </form>
    </div>

  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
  function sendContactMessage() {
    const form = document.getElementById('contactForm');
    const inputs = form.querySelectorAll('.form-control');
    let isValid = true;

    // 1. Validation Logic
    inputs.forEach(input => {
      if (!input.checkValidity()) {
        input.classList.add('is-invalid');
        isValid = false;
      } else {
        input.classList.remove('is-invalid');
      }
    });

    if (!isValid) return;

    // 2. Loading State
    Swal.fire({
      title: 'Sending...',
      text: 'Delivering your message to KrushiVikash',
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });

    // 3. Prepare AJAX Data
    const formData = new FormData(form);

    // We removed the CSRF header logic since CSRF is disabled in your SecurityConfig
    fetch('/client/contact', {
      method: 'POST',
      body: formData
    })
    .then(res => res.text())
    .then(data => {
      Swal.close();
      if (data === "success") {
        Swal.fire({
          icon: 'success',
          title: 'Success!',
          text: 'Your message has been sent successfully.',
          confirmButtonColor: '#27ae60'
        });
        form.reset();
        inputs.forEach(i => i.classList.remove('is-invalid'));
      } else {
        Swal.fire('Error', data, 'error');
      }
    })
    .catch(err => {
      Swal.close();
      Swal.fire('Error', 'Server connection failed.', 'error');
    });
  }

  // Clear invalid status on input
  document.querySelectorAll('.form-control').forEach(input => {
    input.addEventListener('input', function() {
      this.classList.remove('is-invalid');
    });
  });
</script>

</body>
</html>
