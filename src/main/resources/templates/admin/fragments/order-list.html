<div th:fragment="orderTable" xmlns:th="http://www.thymeleaf.org">
  <div class="card border-0 shadow-sm animate__animated animate__fadeIn">
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
      <h5 class="mb-0 text-primary fw-bold">
        <i class="fas fa-shopping-cart me-2"></i>
        Orders for: <span class="text-dark" th:text="${farmerName}">Farmer Name</span>
      </h5>
      <button class="btn btn-sm btn-outline-secondary" onclick="location.reload()">
        <i class="fas fa-arrow-left me-1"></i> Back to Directory
      </button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
          <tr>
            <th>Order ID</th>
            <th>Date</th>
            <th>Customer</th>
            <th>Farmer's Items</th> <th>Sub-Total</th> <th>Status</th>
            <th class="text-center">Action</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="order : ${orders}">
            <td class="fw-bold" th:text="'#' + ${order.id}">#101</td>
            <td th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy HH:mm')}">Date</td>
            <td>
              <div class="d-flex flex-column">
                <span class="fw-bold" th:text="${order.shippingName}">Customer Name</span>
                <small class="text-muted" th:text="${order.shippingPhone}">Phone</small>
              </div>
            </td>

            <td>
                <span class="badge bg-info text-white"
                      th:with="farmerItemCount=${order.orderItems.?[product.farmer.id == __${farmerId}__].size()}"
                      th:text="${farmerItemCount} + ' Items'">0 Items</span>
            </td>

            <td class="fw-bold text-success">
                <span th:with="farmerSubTotal=${#aggregates.sum(order.orderItems.?[product.farmer.id == __${farmerId}__].![priceAtPurchase * quantity])}"
                      th:text="'₹' + ${#numbers.formatDecimal(farmerSubTotal, 1, 2)}">₹0.00</span>
            </td>

            <td>
                <span th:classappend="${order.status == 'DELIVERED' ? 'badge bg-success' :
                                    (order.status == 'CANCELLED' ? 'badge bg-danger' : 'badge bg-warning text-dark')}"
                      th:text="${order.status}">
                    STATUS
                </span>
            </td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-primary"
                      th:onclick="'viewOrderDetails(' + ${order.id} + ',' + ${farmerId} + ')'">
                <i class="fas fa-eye"></i> Details
              </button>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(orders)}">
            <td colspan="7" class="text-center py-5 text-muted">
              <i class="fas fa-box-open fa-3x mb-3 d-block"></i>
              This farmer hasn't received any orders yet.
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="farmerOrderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold">Order Details (Filtered)</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-0" id="modalContent">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>
