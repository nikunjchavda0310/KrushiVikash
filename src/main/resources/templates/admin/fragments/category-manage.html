<div th:fragment="category-manage" xmlns:th="http://www.w3.org/1999/xhtml">
  <div class="row fadeIn animated">

    <div class="col-12">
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm mb-4">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${success}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm mb-4">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    </div>

    <div class="col-md-5">
      <div class="card shadow-sm mb-4 border-primary">
        <div class="card-header bg-primary text-white">
          <h6 class="mb-0"><i class="fas fa-folder-plus me-2"></i>Add New Category</h6>
        </div>
        <div class="card-body">
          <form id="categoryForm">
            <div class="mb-3">
              <label class="form-label fw-bold">Category Name</label>
              <input type="text" name="name" class="form-control" placeholder="e.g. Fruits, Vegetables, Grains" required>
            </div>
            <button type="button" onclick="handleCategorySubmit('categoryForm')" class="btn btn-primary btn-sm w-100 fw-bold">
              <i class="fas fa-save me-1"></i> Save Category
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-7">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
          <h6 class="mb-0"><i class="fas fa-list me-2"></i>Available Categories</h6>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
              <tr>
                <th style="width: 15%;">ID</th>
                <th>Category Name</th>
                <th class="text-center" style="width: 25%;">Action</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="cat : ${categories}">
                <td th:text="${cat.id}"></td>
                <td><span class="fw-bold text-primary" th:text="${cat.name}"></span></td>
                <td class="text-center">
                  <button class="btn btn-outline-danger btn-sm" th:onclick="|handleCategoryDelete(${cat.id})|">
                    <i class="fas fa-trash-alt me-1"></i> Delete
                  </button>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="3" class="text-center text-muted py-4">No categories found.</td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
