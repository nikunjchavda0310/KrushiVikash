<div class="card shadow-sm border-0" xmlns:th="http://www.thymeleaf.org">
  <div class="card-header bg-white py-3">
    <h5 class="mb-0 text-success fw-bold">Update Farmer: [[${farmer.name}]]</h5>
  </div>
  <div class="card-body">
    <form th:action="@{/admin/update/farmer/{id}(id=${farmer.id})}"
          method="post"
          enctype="multipart/form-data">

      <input type="hidden" name="email" th:value="${farmer.email}">

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">Full Name</label>
          <input type="text" class="form-control" name="name" th:value="${farmer.name}" required>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">Gender</label>
          <select class="form-select" name="gender" required>
            <option value="" disabled>Select Gender</option>
            <option value="male" th:selected="${farmer.gender == 'male'}">Male</option>
            <option value="female" th:selected="${farmer.gender == 'female'}">Female</option>
            <option value="other" th:selected="${farmer.gender == 'other'}">Other</option>
          </select>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">Contact</label>
          <input type="text" class="form-control" name="contact" th:value="${farmer.contact}" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold text-muted">Email (Permanent Record)</label>
        <input type="text" class="form-control bg-light" th:value="${farmer.email}" readonly>
        <small class="text-info">Emails cannot be changed for security reasons.</small>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">Update Profile Picture</label>
        <input type="file" class="form-control" name="imageFile">
        <small class="text-muted" th:if="${farmer.image != null}">Current: [[${farmer.image}]]</small>
      </div>

      <div class="form-check form-switch mb-4">
        <input class="form-check-input" type="checkbox" name="verified" id="vCheck" th:checked="${farmer.verified}">
        <label class="form-check-label" for="vCheck">Verified Farmer Status</label>
      </div>

      <div class="d-flex justify-content-end border-top pt-3">
        <button type="button" onclick="window.location.reload()" class="btn btn-secondary me-2">Cancel</button>
        <button type="submit" class="btn btn-success px-5">Save Changes</button>
      </div>
    </form>
  </div>
</div>
